name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the stack and wait for /healthz
        run: node scripts/start-stack.mjs

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'
          SKIP_WEBSERVER: '1'
          BASE_URL: http://localhost:5000

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f ../src/docker-compose.yml logs --no-color --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose -f ../src/docker-compose.yml down -v --remove-orphans
